# ─── Dev profile: H2 in-memory (no MySQL required) ──────────────
spring.datasource.url=jdbc:h2:mem:interviewportal;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Override both dialect properties so MySQLDialect from main application.properties is ignored
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Disable MySQL-specific seed script for H2
spring.sql.init.mode=never
# Suppress open-in-view warning in dev
spring.jpa.open-in-view=false
