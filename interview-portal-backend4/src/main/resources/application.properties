# ─── Server ──────────────────────────────────────
server.port=8080
server.servlet.context-path=/api

# ─── MySQL DataSource ─────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/interview_portal?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ─────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ─── Seed data on first run ───────────────────────
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true

# ─── JWT ─────────────────────────────────────────
# Generate a strong base64-encoded 256-bit secret for production:
#   openssl rand -base64 32
jwt.secret=${JWT_SECRET}
jwt.expiration=604800000

# ─── Multipart (for profile image upload) ────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ─── Logging ─────────────────────────────────────
logging.level.com.interviewportal=INFO
logging.level.org.springframework.security=WARN

# ??? Gmail SMTP Configuration ???????????????????????????????
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

gemini.api.key=${GEMINI_API_KEY}
